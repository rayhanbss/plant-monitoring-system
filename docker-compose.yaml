services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  emqx:
    image: emqx/emqx-enterprise:5.3.0-full
    ports:
      - "1883:1883"
      - "18083:18083"


  mqtt-producer:
    build: ./mqtt-producer
    depends_on:
      - emqx

  raw-data-consumer:
    build: ./raw-data-consumer
    depends_on:
      - kafka
  weather-api:
    build: ./weather-api
    depends_on:
      - kafka
